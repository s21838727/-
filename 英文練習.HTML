<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 語音點餐系統</title>
    <style>
        /* 調整主區塊寬度，讓 4 直欄有足夠的空間延伸 */
        body { font-family: sans-serif; max-width: 900px; margin: 40px auto; padding: 20px; text-align: center; background: #f9f9f9; }
        
        /* 1. 新增網格容器樣式 */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr); /* 核心設定：一排 4 個，平分寬度 */
            gap: 12px; /* 項目之間的間距 */
            margin: 20px 0;
        }

        /* 2. 修改單字項目樣式，改為垂直排列以符合格子形狀 */
        .menu-item { 
            background: white; 
            padding: 15px; 
            border-radius: 8px; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.1); 
            display: flex; 
            flex-direction: column; /* 改為上下排列，英文在上、按鈕在下 */
            justify-content: center; 
            align-items: center; 
            gap: 10px;
        }
        
        /* 讓按鈕寬度自動適應格子 */
        button { background: #4caf50; color: white; border: none; padding: 8px 12px; border-radius: 5px; cursor: pointer; font-weight: bold; width: 100%; box-sizing: border-box; font-size: 14px; }
        button:hover { background: #388e3c; }
        #ai-box { margin-top: 20px; background: #f1f8e9; padding: 15px; border-radius: 8px; border-left: 5px solid #4caf50; text-align: left; display: none; }

        /* 3. 響應式網頁設計：手機或螢幕太小時自動切換排列數量 */
        @media (max-width: 768px) {
            .grid-container { grid-template-columns: repeat(2, 1fr); } /* 平板/大手機一排 2 個 */
        }
        @media (max-width: 480px) {
            .grid-container { grid-template-columns: repeat(1, 1fr); } /* 小手機一排 1 個 */
        }
    </style>
</head>
<body>

    <h1>🔊 AI 英文單字</h1>
    <p>點擊按鈕，AI 就會一邊說中文和英文囉！</p>

    <!-- 用 grid-container 把所有單字包起來 -->
    <div class="grid-container">
        <!-- 傳入參數：單字, 中文名稱 -->
        <div class="menu-item"> <span>蘋果 Apple</span> <button onclick="aiSpeak('Apple', '蘋果')">點選 / AI 介紹</button> </div> 
        <div class="menu-item"> <span>香蕉 Banana</span> <button onclick="aiSpeak('Banana', '香蕉')">點選 / AI 介紹</button> </div>
        <div class="menu-item"> <span>貓 Cat</span> <button onclick="aiSpeak('Cat', '貓')">點選 / AI 介紹</button> </div>
        <div class="menu-item"> <span>狗 Dog</span> <button onclick="aiSpeak('Dog', '狗')">點選 / AI 介紹</button> </div>
        <div class="menu-item"> <span>蛋 Egg</span> <button onclick="aiSpeak('Egg', '蛋')">點選 / AI 介紹</button> </div>
        <div class="menu-item"> <span>魚 Fish</span> <button onclick="aiSpeak('Fish', '魚')">點選 / AI 介紹</button> </div>
        <div class="menu-item"> <span>遊戲 Game</span> <button onclick="aiSpeak('Game', '遊戲')">點選 / AI 介紹</button> </div>
        <div class="menu-item"> <span>家 Home</span> <button onclick="aiSpeak('Home', '家')">點選 / AI 介紹</button> </div>
        <div class="menu-item"> <span>冰 Ice</span> <button onclick="aiSpeak('Ice', '冰')">點選 / AI 介紹</button> </div>
        <div class="menu-item"> <span>果汁 Juice</span> <button onclick="aiSpeak('Juice', '果汁')">點選 / AI 介紹</button> </div>
        <div class="menu-item"> <span>風箏 Kite</span> <button onclick="aiSpeak('Kite', '風箏')">點選 / AI 介紹</button> </div>
        <div class="menu-item"> <span>獅子 Lion</span> <button onclick="aiSpeak('Lion', '獅子')">點選 / AI 介紹</button> </div>
        <div class="menu-item"> <span>猴子 Monkey</span> <button onclick="aiSpeak('Monkey', '猴子')">點選 / AI 介紹</button> </div>
        <div class="menu-item"> <span>鳥巢 Nest</span> <button onclick="aiSpeak('Nest', '鳥巢')">點選 / AI 介紹</button> </div>
        <div class="menu-item"> <span>柳橙 Orange</span> <button onclick="aiSpeak('Orange', '柳橙')">點選 / AI 介紹</button> </div>
        <div class="menu-item"> <span>豬 Pig</span> <button onclick="aiSpeak('Pig', '豬')">點選 / AI 介紹</button> </div>
        <div class="menu-item"> <span>皇后 Queen</span> <button onclick="aiSpeak('Queen', '皇后')">點選 / AI 介紹</button> </div>
        <div class="menu-item"> <span>兔子 Rabbit</span> <button onclick="aiSpeak('Rabbit', '兔子')">點選 / AI 介紹</button> </div>
        <div class="menu-item"> <span>太陽 Sun</span> <button onclick="aiSpeak('Sun', '太陽')">點選 / AI 介紹</button> </div>
        <div class="menu-item"> <span>老虎 Tiger</span> <button onclick="aiSpeak('Tiger', '老虎')">點選 / AI 介紹</button> </div>
        <div class="menu-item"> <span>雨傘 Umbrella</span> <button onclick="aiSpeak('Umbrella', '雨傘')">點選 / AI 介紹</button> </div>
        <div class="menu-item"> <span>廂型車 Van</span> <button onclick="aiSpeak('Van', '廂型車')">點選 / AI 介紹</button> </div>
        <div class="menu-item"> <span>水 Water</span> <button onclick="aiSpeak('Water', '水')">點選 / AI 介紹</button> </div>
        <div class="menu-item"> <span>X光 X-ray</span> <button onclick="aiSpeak('X-ray', 'X光')">點選 / AI 介紹</button> </div>
        <div class="menu-item"> <span>溜溜球 Yo-yo</span> <button onclick="aiSpeak('Yo-yo', '溜溜球')">點選 / AI 介紹</button> </div>
        <div class="menu-item"> <span>斑馬 Zebra</span> <button onclick="aiSpeak('Zebra', '斑馬')">點選 / AI 介紹</button> </div>
    </div>

    <!-- AI 說明文字區塊 -->
    <div id="ai-box">
        <h3 id="ai-title" style="margin: 0 0 5px 0; color: #2e7d32;"></h3>
        <p id="ai-text" style="margin: 0; color: #333;"></p>
    </div>

    <script>
        function aiSpeak(englishWord, chineseWord) {
            const box = document.getElementById('ai-box');
            const title = document.getElementById('ai-title');
            const text = document.getElementById('ai-text');
            
            // 顯示畫面文字
            title.innerText = `🤖 AI 正在為您介紹：${englishWord}`;
            text.innerText = `英文：${englishWord} \n中文：${chineseWord}`;
            box.style.display = 'block';

            // 先停止目前所有正在播放的語音
            window.speechSynthesis.cancel(); 

            // 1. 建立英文語音（設定美式發音，速度稍慢以利聽清）
            const engUtterance = new SpeechSynthesisUtterance(englishWord);
            engUtterance.lang = 'en-US'; 
            engUtterance.pitch = 1.0;    
            engUtterance.rate = 0.9;     

            // 2. 建立中文語音
            const chnUtterance = new SpeechSynthesisUtterance(`的意思是，${chineseWord}`);
            chnUtterance.lang = 'zh-TW'; 
            chnUtterance.pitch = 1.0;    
            chnUtterance.rate = 1.1;     

            // 3. 依序播放：先念英文，再念中文
            window.speechSynthesis.speak(engUtterance);
            window.speechSynthesis.speak(chnUtterance);
        }
    </script>

</body>
</html>
